    <section class="page" id="p-quehacer">
      <div class="wrap">
        <h3 data-es="¿Qué hacer en Manilva?" data-en="What to do in Manilva?"></h3>
        <div class="mon-intro">
          <p class="mon-kicker" data-es="Monumentos" data-en="Monuments"></p>
          <p data-es="El visitante de nuestra localidad y de sus alrededores cuenta con múltiples oportunidades de enriquecimiento cultural y de esparcimiento para los sentidos."
            data-en="Visitors to our town and its surroundings have many opportunities for cultural enrichment and for delighting the senses."></p>
          <p data-es="No en vano, el paso de los siglos y el tránsito de gentes por estas tierras ha deparado un patrimonio tan rico como sugerente. En el Patrimonio Cultural de Manilva sobresalen dos grandes yacimientos arqueológicos, ambos declarados Bien de Interés Cultural: Los Castillejos de Alcorrín y el «Entorno del Castillo de la Duquesa»."
            data-en="The passing of the centuries and of peoples through these lands has left a heritage as rich as it is evocative. Two major archaeological sites stand out in Manilva's cultural heritage, both declared Assets of Cultural Interest: Los Castillejos de Alcorrín and the surroundings of Castillo de la Duquesa."></p>
          <p data-es="El yacimiento romano del «Entorno del Castillo de la Duquesa» tiene una cronología que va desde el siglo I d. C. hasta el V d. C. El conjunto está compuesto por necrópolis, villa, termas y factoría de salazón de pescado. Surge este enclave como consecuencia de la industria conservera que giraba en torno a la pesca del atún en almadrabas."
            data-en="The Roman site around Castillo de la Duquesa spans from the 1st century AD to the 5th century AD. It comprises a necropolis, a villa, baths and a fish-salting factory. The settlement arose from the canning industry built around tuna fishing with almadrabas (traditional traps)."></p>
        </div>
